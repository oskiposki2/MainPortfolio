<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galleri</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double+Ink:wght@100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="img/favicon/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="img/favicon/favicon-96x96.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="img/favicon/apple-touch-icon.png"
    />
    <link rel="icon" href="img/favicon/favicon.ico" />
    <script type="module" src="js/gallery/gallery.js"></script>
  </head>
  <body>
    <header id="gallery-page-bg">
      <div class="container" id="galleryTitleContainer">
        <h1>FOTOGALLERI</h1>
        <h3>Ett urval av ögonblick fångande genom min kamera</h3>
      </div>
    </header>
    <main>
      <div class="container">
        <section id="gallery"></section>
      </div>
      <div id="lightbox">
        <span id="close">&times;</span>
        <span id="previous">&#10094;</span>

        <img id="lightbox-image" />

        <span id="next">&#10095;</span>
      </div>
      <button id="scrollTop" aria-label="Till toppen">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 19V5M6 11l6-6 6 6" />
  </svg>
</button>
    </main>
    <footer class="footerContainer" id="footer"></footer>

  </body>
</html>
